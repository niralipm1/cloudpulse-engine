version: '3.8'

services:
  cloudpulse:
    build: .
    ports:
      - "9092:9092"
    environment:
      - REDIS_ADDR=redis:6379
      - POSTGRES_DSN=postgres://cloudpulse:secret@postgres:5432/telemetry?sslmode=disable
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=cloudpulse
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=telemetry
    ports:
      - "5432:5432"
